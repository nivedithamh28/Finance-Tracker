version: '3.8'

services:
  db:
    image: postgres:15
    container_name: finance_postgres
    environment:
      POSTGRES_USER: finance_user
      POSTGRES_PASSWORD: finance_password
      POSTGRES_DB: finance_db
    ports:
      - "5433:5432"
    privileged: true
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finance_user -d finance_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./finance-backend
    container_name: finance_backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/finance_db
      SPRING_DATASOURCE_USERNAME: finance_user
      SPRING_DATASOURCE_PASSWORD: finance_password
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    privileged: true
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./finance-frontend
    container_name: finance_frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:

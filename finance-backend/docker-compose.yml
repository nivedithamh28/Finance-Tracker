version: '3.8'

services:
  postgres-db:
    image: postgres:15
    container_name: finance_postgres
    environment:
      POSTGRES_USER: finance_user
      POSTGRES_PASSWORD: finance_password
      POSTGRES_DB: finance_db
    ports:
      - "5432:5432"
    volumes:
      - finance-postgres-data:/var/lib/postgresql/data

volumes:
  finance-postgres-data: